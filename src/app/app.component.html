<header class="app-header">
  <div class="container">

    <div class="logo">
      <h1>TIDY</h1>
    </div>

    <nav class="nav-links">

      <!-- Si NON connecté -->
      <ng-container *ngIf="!(authService.currentUser$ | async)">
        <a routerLink="/login">Connexion</a>
        <a routerLink="/register">Créer un compte</a>
      </ng-container>

      <!-- Si connecté -->
      <ng-container *ngIf="authService.currentUser$ | async as user">
        <span class="welcome">Bonjour {{ user.username }}</span>
        <a routerLink="/clean">Nettoyage</a>
        <a routerLink="/history">Historique</a>
        <button class="logout-btn" (click)="logout()">Déconnexion</button>
      </ng-container>

    </nav>
  </div>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <div class="container">
    © 2026 Data Cleaning API
  </div>
</footer>
