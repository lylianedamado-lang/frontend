<header class="app-header">
  <div class="container">

    <div class="logo">

      <a [routerLink]="['/']" aria-label="Tidy - Accueil">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </a>
      <h1><a [routerLink]="['/']">TIDY</a></h1>
    </div>

    <nav class="nav-links">

      <!-- Si NON connecté -->
      <ng-container *ngIf="!(authService.currentUser$ | async)">
        <a routerLink="/login">Connexion</a>
        <a routerLink="/register">Créer un compte</a>
      </ng-container>

      <!-- Si connecté -->
      
      <ng-container *ngIf="authService.currentUser$ | async as user">
      
        <button type="button" class="nav-link-btn" (click)="goTo('/clean')">Nettoyage</button>
        <button type="button" class="nav-link-btn" (click)="goTo('/history')">Historique</button>
        <button class="logout-btn" (click)="logout()">Déconnexion</button>
      </ng-container>

    </nav>
  </div>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <div class="container">
    © 2026 Data Cleaning API-votre plateforme de préprocessing
  </div>
</footer>
