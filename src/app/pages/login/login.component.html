<div class="auth-page d-flex align-items-center justify-content-center min-vh-100">
  <div class="auth-card card border-0 shadow-lg">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <div class="auth-icon mb-3"><i class="bi bi-droplet-half"></i></div>
        <h2 class="fw-bold text-dark">Connexion à TIDY</h2>
        <p class="text-muted">Nettoyez vos données en quelques clics</p>
      </div>

      <div class="alert alert-danger rounded-3 d-flex align-items-center" *ngIf="errorMessage">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label fw-semibold"><i class="bi bi-envelope me-1"></i> Email</label>
          <input type="email" class="form-control form-control-lg input-custom" placeholder="exemple@email.com"
                 [(ngModel)]="email" name="email" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold"><i class="bi bi-lock me-1"></i> Mot de passe</label>
          <input type="password" class="form-control form-control-lg input-custom" placeholder="••••••••"
                 [(ngModel)]="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-violet btn-lg w-100 mb-3" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ loading ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>
      <div class="text-center mt-3">
        <span class="text-muted">Pas encore de compte ?</span>
        <a routerLink="/register" class="ms-1 fw-semibold text-decoration-none link-violet">Créer un compte</a>
      </div>
    </div>
  </div>
</div>
