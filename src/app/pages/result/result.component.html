<div class="result-container">
  <div class="header-section">
    <h1>Résultats du nettoyage</h1>
    <p class="subtitle">Comparaison avant/après nettoyage</p>
  </div>

  <div class="results-content">
    <div class="stats-comparison">
      <div class="stats-card">
        <div class="stats-header">
          <h3>📊 Avant nettoyage</h3>
          <span class="stats-badge">Original</span>
        </div>

        <div class="table-container">
          <table class="stats-table">
            <thead>
              <tr><th>Métrique</th><th>Valeur</th></tr>
            </thead>
            <tbody>
              <tr *ngFor="let s of statsAvant | keyvalue">
                <td class="metric-name">{{ s.key }}</td>
                <td class="metric-value">{{ s.value }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="stats-card">
        <div class="stats-header">
          <h3>✅ Après nettoyage</h3>
          <span class="stats-badge">Nettoyé</span>
        </div>
        <div class="table-container">
          <table class="stats-table">
            <thead>
              <tr><th>Métrique</th><th>Valeur</th></tr>
            </thead>
            <tbody>
              <tr *ngFor="let s of statsApres | keyvalue">
                <td class="metric-name">{{ s.key }}</td>
                <td class="metric-value">{{ s.value }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>


    <div class="download-section">
      <div class="download-card">
        <h3>📥 Télécharger le fichier nettoyé</h3>
        <p>Votre fichier <strong>{{ fileName }}</strong> est prêt au téléchargement.</p>
        <button class="download-btn" (click)="downloadFile()">
          <span>Télécharger le fichier</span>
        </button>
      </div>

    </div>
    

    <div class="action-buttons">
      <button class="back-btn" (click)="goBack()">Nettoyer un autre fichier</button>
    </div>
  </div>
</div>
