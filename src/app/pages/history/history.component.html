<div class="page-wrapper">
  <div class="container py-5">
    <div class="text-center mb-5">
      <h1 class="fw-bold"><i class="bi bi-clock-history text-violet me-2"></i>Historique des nettoyages</h1>
      <p class="text-muted">Retrouvez tous les fichiers que vous avez nettoyés avec TIDY</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger rounded-4 d-flex align-items-center mb-4">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
      <button class="btn-close ms-auto" (click)="errorMessage = ''"></button>
    </div>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-violet" style="width:3rem;height:3rem;"></div>
      <p class="text-muted mt-3">Chargement...</p>
    </div>

    <div *ngIf="!loading && history.length === 0 && !errorMessage" class="card border-0 shadow-sm rounded-4 text-center p-5">
      <div class="empty-icon mb-3"><i class="bi bi-inbox"></i></div>
      <h5 class="text-muted">Aucun historique</h5>
      <p class="text-muted small">Vos nettoyages apparaîtront ici après utilisation de TIDY</p>
    </div>

    <div *ngIf="!loading && history.length > 0" class="row g-3">
      <div class="col-md-6 col-lg-4" *ngFor="let item of history">
        <div class="card border-0 shadow-sm rounded-4 history-card h-100">
          <div class="card-body p-4">
            <div class="d-flex align-items-start gap-3">
              <div class="hist-icon"><i class="bi" [ngClass]="getIcon(item.original_filename)"></i></div>
              <div class="flex-grow-1" style="min-width:0;">
                <h6 class="fw-bold mb-1 text-truncate" [title]="item.original_filename">{{ item.original_filename }}</h6>
                <p class="text-muted small mb-0"><i class="bi bi-calendar3 me-1"></i>{{ formatDate(item.cleaned_at) }}</p>
              </div>
            </div>
            <div class="mt-3 d-flex align-items-center justify-content-between">
              <span class="badge badge-done"><i class="bi bi-check-circle me-1"></i>Nettoyé</span>
              <button class="btn btn-sm btn-download rounded-pill px-3"
                      (click)="downloadFile(item)"
                      [disabled]="downloadingId === item.file_id">
                <span *ngIf="downloadingId === item.file_id" class="spinner-border spinner-border-sm me-1"></span>
                <i *ngIf="downloadingId !== item.file_id" class="bi bi-download me-1"></i>
                {{ downloadingId === item.file_id ? 'Téléchargement...' : 'Télécharger' }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="!loading && history.length > 0" class="text-center mt-4">
      <button class="btn btn-outline-violet rounded-pill px-4" (click)="loadHistory()">
        <i class="bi bi-arrow-clockwise me-2"></i> Rafraîchir
      </button>
    </div>
  </div>
</div>
