<div class="history-container">

  <div class="history-header">
    <h1>Historique des nettoyages</h1>
    <p>Liste des fichiers que vous avez traités</p>
  </div>

  <div *ngIf="loading" class="loading">
    Chargement...
  </div>

  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading && history.length === 0" class="empty">
    Aucun fichier nettoyé pour le moment.
  </div>

  <div *ngIf="history.length > 0" class="history-list">
    <div class="history-card" *ngFor="let item of history">
      <div class="file-name">
        📄 {{ item.original_filename }}
      </div>
      <div class="file-date">
        Nettoyé le : {{ formatDate(item.cleaned_at) }}
      </div>
    </div>
  </div>

</div>
