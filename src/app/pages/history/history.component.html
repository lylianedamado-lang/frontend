<div class="history-container">

  <div class="history-header">
    <h1>Historique de vos nettoyages effectués</h1>
    <p>La liste des fichiers que vous avez traités sera affichée ici</p>
  </div>

  <div *ngIf="loading && history.length === 0" class="history-loading" aria-label="Chargement de l'historique"></div>

  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>
  <div *ngIf="downloadError" class="error">
    {{ downloadError }}
  </div>

  <div *ngIf="!loading && history.length === 0" class="empty">
    Aucun fichier nettoyé pour le moment.
  </div>

  <div *ngIf="history.length > 0" class="history-list">
    <div class="history-card" *ngFor="let item of history">
      <div class="file-name">
        📄 {{ item.original_filename }}
      </div>
      <div class="file-date">
        Nettoyé le : {{ formatDate(item.cleaned_at) }}
      </div>
      <button
        type="button"
        class="download-btn"
        (click)="download(item)"
        [disabled]="!isDownloadAvailable(item) || downloadingFile === getItemKey(item)">
        {{
          downloadingFile === getItemKey(item)
            ? 'Téléchargement...'
            : (isDownloadAvailable(item) ? 'Retélécharger' : 'Indisponible')
        }}
      </button>
    </div>
  </div>

</div>
