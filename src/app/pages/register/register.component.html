<div class="auth-container">

  <div class="auth-header">
    <h1>Bienvenu sur TIDY, votre plateforme de nettoyage de données</h1>
    <p class="subtitle">
      Créez votre compte pour utiliser l'API
    </p>
  </div>

  <div class="auth-card">

    <h2>Créer un compte</h2>

    <form (ngSubmit)="onRegister()" #registerForm="ngForm">

      <div class="form-group">
        <label>Nom d'utilisateur</label>
        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          required
          placeholder="Votre nom d'utilisateur">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="exemple@email.com">
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Majuscule + chiffres (ex: Password1)">
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </div>

      <button type="submit" class="auth-btn" [disabled]="loading">
        {{ loading ? 'Création...' : 'Créer un compte' }}
      </button>

    </form>

<div class="auth-footer">
  <p>
    Vous avez déjà un compte ?
    <a (click)="goToLogin()" class="auth-link">
      Se connecter
    </a>
  </p>
</div>


  </div>

</div>
